[platformio]
src_dir = ESPTimeCast_ESP32
default_envs =
    esp32
    esp32s2_lolin
    esp32s2_feather
    esp32c3_supermini
    esp32s3_wroom
    esp32s3_supermini
    esp32s3_zero

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    majicdesigns/MD_Parola @ 3.7.5
    majicdesigns/MD_MAX72XX @ 3.5.1
    esp32async/AsyncTCP @ 3.4.10
    esp32async/ESPAsyncWebServer @ 3.11.2

[env:esp32]
board = esp32dev

[env:esp32s2_lolin]
board = lolin_s2_mini

[env:esp32s2_feather]
board = adafruit_feather_esp32s2

[env:esp32c3_supermini]
board = nologo_esp32c3_super_mini

[env:esp32s3_wroom]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_supermini]
board = esp32-s3-fh4r2
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_zero]
board = waveshare_esp32_s3_zero
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
